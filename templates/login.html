<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
        <!--change the href to {{ url_for('static', path='styles.css') }} when using jinja2templates-->
        <title>BookBeats Login Page</title>
    </head>
    <body class="login-body">
        <div class="login-wrapper">
            <h1 id="login-page-heading">Welcome to BookBeats!</h1>
            <p id="login-page-statement">Please sign in to continue...</p>
            <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="holds-tabs">
                    <span class="tabs active-tab">Sign In</span>
                    <a href="{{ url_for('signup_page')}}" class="tabs">Sign Up</a>
                </div>
                <form class="sign-in" action="/login" method="post">
                    <div class="input-group">
                        <label>Email:</label>
                        <input id="signin-email" type="email" name="email" required placeholder="Email">
                    </div>
                    <div class="input-group">
                        <label for="signin-password">Password:</label>
                        <input type="password" id="signin-password" name="password" required placeholder="Password" minlength="8">
                    </div>
                    <button>Login</button>
                </form>
            </div>
        </div>
    </body>
</html>
